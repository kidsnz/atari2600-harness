# gitleaks rules for this PUBLIC repository: the default credential rules, plus paths that only
# make sense on one machine. The works' private words are NOT here (that would publish them);
# scripts/check_leaks.py adds them from the private works repository at run time.

[extend]
useDefault = true

[[rules]]
id = "home-path"
description = "an absolute path inside someone's home folder"
regex = '''(?:/Users|/home)/[A-Za-z][A-Za-z0-9._-]*/'''

[[rules]]
id = "session-temp-path"
description = "a Claude Code session's temporary folder, gone when the session ends"
regex = '''/private/tmp/claude-\d+'''
