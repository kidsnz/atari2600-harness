name: CI

on:
  push:
  pull_request:
  # Manual trigger. Added 2026-08-06 after three pushes landed on the remote
  # (`git ls-remote` confirmed main at ca2d2e2) without GitHub creating a single
  # workflow run — the Actions page sat at #565 with no error banner and no quota
  # message. With only `push` and `pull_request` there was no way to ask for a run,
  # so a green build could not be obtained at all until GitHub decided to start
  # listening again. `gh workflow run ci.yml` now covers that.
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@v5

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install DASM (assembler)
        run: sudo apt-get update && sudo apt-get install -y dasm

      - name: Clone the Gopher2600 engine (pinned)
        # The harness embeds Gopher2600 via `replace => ./Gopher2600` (gitignored).
        # Pin the exact commit the harness is verified against.
        run: |
          git clone https://github.com/JetSetIlly/Gopher2600.git
          git -C Gopher2600 checkout 5d532e8831c63a4794c1ce3f5f4c32ad069aee8b

      - name: Assemble ROMs (.bin are gitignored; tests/scenarios need them)
        run: |
          for f in roms/litmus/*.asm roms/techniques/*.asm roms/exerciser/*.asm roms/carts/*.asm; do
            dasm "$f" -f3 -o"${f%.asm}.bin"
          done

      - name: Build / vet / test (no cgo — the harness uses SDL-free Gopher2600 packages)
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go vet ./...
          # -p 1: SERIAL, and the reason is a MEASURED one as of 2026-09-06, not the
          # stale comment that used to sit here. The old text blamed a shared-.bin write
          # race that `internal/build`'s per-PID scratch name had already made impossible;
          # removing the flag on that basis was tried on this runner and FAILED:
          #
          #   panic: test timed out after 10m0s
          #   FAIL github.com/kidsnz/atari2600-harness/internal/emu  600.013s
          #
          # Parallel packages do not each go faster, they SHARE the cores. `internal/emu`
          # is the heavy one; with -p 1 it gets the whole runner and finishes, and in
          # parallel it competes and blows Go's default per-package 10-minute timeout.
          # It passed three times on the 8-core machine it was measured on (265 s against
          # 539 s) and failed the first time it met this 4-core runner. **The ratio did
          # not carry, and neither did the greenness.**
          #
          # If this is revisited: the question is not "is the race real" (it is not), it
          # is "does internal/emu fit in a per-package timeout while sharing 4 cores".
          # Raise -timeout, or split that package, or cap with -p 2 -- and measure it HERE,
          # because a measurement taken on 8 cores did not predict this runner.
          go test -p 1 ./...

      - name: Regression scenarios (litmus + techniques)
        env:
          CGO_ENABLED: "0"
        run: go run ./cmd/scenario roms/litmus/scenarios/*.json roms/techniques/scenarios/*.json roms/exerciser/scenarios/*.json

      - name: CPU conformance self-test (the gate must reject a planted-wrong expectation)
        env:
          CGO_ENABLED: "0"
        run: bash scripts/check_cpu_conformance.sh --selftest

      - name: CPU conformance — Klaus + Tom-Harte subset (external authoritative suites)
        # Certifies the embedded Gopher2600 CPU core against suites the harness does NOT author:
        # Klaus 6502 functional+decimal (embedded in the clone) + a Tom-Harte/SingleStepTests subset
        # (per-cycle bus; fetched on demand, MIT, not vendored). Full 256-opcode run is local-only (1GB).
        env:
          CGO_ENABLED: "0"
        run: bash scripts/check_cpu_conformance.sh

      - name: Provenance check (every technique/rule records its origin)
        run: python3 scripts/check_provenance.py

      - name: Trap check (no emu-passes/HW-fails static traps in technique kernels)
        run: |
          python3 scripts/check_traps.py --selftest
          python3 scripts/check_traps.py
          python3 scripts/check_tests.py --selftest
          python3 scripts/check_tests.py
          python3 scripts/check_instruments.py --selftest
          python3 scripts/check_instruments.py

      - name: Wiring check (no orphaned knowledge — every doc reachable from an entrypoint)
        run: python3 scripts/check_wiring.py
